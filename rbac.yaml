apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-backend-sa
  namespace: terminal-web

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terminal-pod-manager
  namespace: terminal-web
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "get", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terminal-backend-binding
  namespace: terminal-web
subjects:
  - kind: ServiceAccount
    name: terminal-backend-sa
    namespace: terminal-web
roleRef:
  kind: Role
  name: terminal-pod-manager
  apiGroup: rbac.authorization.k8s.io